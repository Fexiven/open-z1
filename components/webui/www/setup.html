<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Z1 Wi-Fi setup</title>
<style>
:root { --bg: #f6f6f4; --fg: #1d1d1b; --mute: #5c5c57; --card: #fff; --line: #ccc; --ok: #14833b; --bad: #a3171b; --acc: #2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #e8e8e4; --mute: #a3a39d; --card: #22221f; --line: #4a4a45; --ok: #4ccf7a; --bad: #ffb1ab; --acc: #7aa7ff; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
main { max-width: 420px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 12px; }
label { display: block; margin: 12px 0 4px; color: var(--mute); }
select, input, button { font: inherit; width: 100%; min-height: 44px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button { margin-top: 12px; cursor: pointer; font-weight: 600; }
button:disabled { opacity: .6; cursor: progress; }
#join { background: var(--acc); border-color: var(--acc); color: var(--card); }
.row { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--mute); }
.row input { width: auto; min-height: 0; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
#msg { margin: 12px 0 0; overflow-wrap: anywhere; }
#msg.ok { color: var(--ok); font-weight: 600; } #msg.bad { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>Z1 Wi-Fi setup</h1>
<form id="f">
<label for="ssid">Network</label>
<select id="ssid"><option value="">scanning…</option></select>
<button type="button" id="rescan">Scan again</button>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="63">
<label class="row"><input type="checkbox" id="showpw"> Show password</label>
<button id="join">Connect</button>
</form>
<p id="msg" aria-live="polite"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const H = {'X-Requested-With': 'z1-setup'};
const wait = ms => new Promise(ok => setTimeout(ok, ms));
const timeout = ms => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
const say = (t, cls) => { $('msg').textContent = t; $('msg').className = cls || ''; };

// Starts a scan or join, then polls /setup/result until it is done. The
// hotspot may drop for a while (a join changes the radio's channel): polling
// goes on through that for up to 60 s; null if it never answers again.
async function run(url, body) {
  let r;
  try {
    r = await fetch(url, {method: 'POST', headers: H, body, signal: timeout(5000)});
  } catch (e) {
    throw new Error('the machine does not answer; is this device still on its hotspot?');
  }
  if (!r.ok) throw new Error((await r.text()).trim());
  for (const end = Date.now() + 60000; Date.now() < end;) {
    await wait(1000);
    try {
      const t = await (await fetch('/setup/result', {signal: timeout(3000), cache: 'no-store'})).text();
      const nl = t.indexOf('\n'), state = t.slice(0, nl);
      if (state !== 'busy') return {ok: state === 'ok', text: t.slice(nl + 1)};
    } catch (e) {}
  }
  return null;
}

// The networks found, strongest first, each name once.
async function scan() {
  const sel = $('ssid');
  $('rescan').disabled = true;
  $('rescan').textContent = 'Scanning…';
  say('');
  try {
    const r = await run('/setup/scan', '');
    if (!r) throw new Error('the hotspot does not answer');
    const best = new Map();
    for (const line of r.text.split('\n')) {
      const f = line.split(',');
      if (f.length < 4 || !f[0]) continue;
      const name = f[0].replaceAll('\x01', ' '), rssi = +f[2];
      if (!best.has(name) || best.get(name).rssi < rssi) best.set(name, {rssi, open: f[1] === '0'});
    }
    const keep = sel.value;
    sel.textContent = '';
    for (const [name, n] of [...best].sort((a, b) => b[1].rssi - a[1].rssi)) {
      const o = new Option(name + (n.open ? ' (open)' : '') + ' \u00b7 ' + n.rssi + ' dBm', name);
      o.selected = name === keep;
      sel.add(o);
    }
    if (!sel.options.length) sel.add(new Option('no networks found', ''));
  } catch (e) {
    if (!sel.value) sel.innerHTML = '<option value="">no networks: scan again</option>';
    say('Scan failed: ' + e.message, 'bad');
  }
  $('rescan').disabled = false;
  $('rescan').textContent = 'Scan again';
}

$('rescan').onclick = scan;
$('showpw').onchange = () => { $('pw').type = $('showpw').checked ? 'text' : 'password'; };
$('f').onsubmit = async ev => {
  ev.preventDefault();
  const ssid = $('ssid').value, pw = $('pw').value;
  if (!ssid) return say('Choose a network first.', 'bad');
  if (pw && pw.length < 8) return say('A Wi-Fi password has at least 8 characters.', 'bad');
  $('join').disabled = $('rescan').disabled = true;
  $('join').textContent = 'Connecting…';
  say('Connecting to ' + ssid + ' (up to 20 s)… This device may drop off the hotspot ' +
    'meanwhile, when the machine switches to the network\'s channel; let it reconnect to the hotspot.');
  try {
    const r = await run('/setup/join', ssid + '\n' + pw);
    const ip = r && (r.text.match(/ip: ([0-9.]+)/) || [])[1];
    if (r && r.ok && ip) $('pw').value = '';
    say(!r
      ? 'The hotspot no longer answers: the machine has probably joined ' + ssid + '. Connect this device to ' +
        ssid + ' and look for the machine in the app.'
      : r.ok && ip
      ? 'Connected. The machine is at ' + ip + ' on ' + ssid + '; this hotspot closes in 30 s. ' +
        'Connect this device to ' + ssid + ' and open http://' + ip + '/ or the app.'
      : 'Not connected: ' + (r.text.trim().replace(/\.$/, '') || 'no reason given') + '. Check the password and try again.', r && r.ok && ip ? 'ok' : r ? 'bad' : '');
  } catch (e) {
    say('Not connected: ' + e.message, 'bad');
  }
  $('join').disabled = $('rescan').disabled = false;
  $('join').textContent = 'Connect';
};
scan();
</script>
</body>
</html>
